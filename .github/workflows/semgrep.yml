name: Semgrep Security Scan

on:
  pull_request: {}
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Понедельник 06:00 UTC

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # semgrep ci не принимает --error (это флаг semgrep scan); в standalone-режиме
      # без Semgrep-платформы корректная команда — scan. Пишем SARIF для Code Scanning.
      # NB: без --error — часть ERROR-рул в .semgrep.yml намеренно широкая
      # (create table, export const POST) и требует тюнинга до блокирующего режима.
      - name: Semgrep (custom rules → SARIF)
        run: semgrep scan --config .semgrep.yml --sarif --output semgrep.sarif --metrics off

      - name: Semgrep OSS rules (nextjs + security-audit)
        run: |
          semgrep scan \
            --config p/nextjs \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --metrics off || true # OSS rules могут быть шумными, фейлим только на наших

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
