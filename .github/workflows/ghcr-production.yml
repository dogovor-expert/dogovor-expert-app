name: Build & Push GHCR (production)

on:
  workflow_dispatch:
    inputs:
      NEXT_PUBLIC_SUPABASE_URL:
        description: 'Supabase project URL (public)'
        type: string
        default: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY:
        description: 'Supabase anon key (public)'
        type: string
        default: ''
      NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY:
        description: 'Yandex SmartCaptcha client key (public)'
        type: string
        default: ''
      NEXT_PUBLIC_CHAT_ENABLED:
        description: '1 = include chat widget'
        type: string
        default: ''
      NEXT_PUBLIC_APP_URL:
        description: 'Canonical app URL'
        type: string
        default: ''
      NEXT_PUBLIC_SITE_URL:
        description: 'Canonical site URL'
        type: string
        default: ''
      NEXT_PUBLIC_INSSMART_TOKEN:
        description: 'Inssmart widget token'
        type: string
        default: ''
      NEXT_PUBLIC_INSSMART_SECRET:
        description: 'Inssmart widget secret'
        type: string
        default: ''
      NEXT_PUBLIC_INSSMART_PRODUCT:
        description: 'Inssmart widget product path (ex: /eosago)'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-production
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/dogovor-expert/dogovor-expert-app:production
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          # NEXT_PUBLIC_* РёРЅР»Р°Р№РЅСЏС‚СЃСЏ РІ РєР»РёРµРЅС‚СЃРєРёР№ Р±Р°РЅРґР» РЅР° Р±РёР»РґРµ вЂ” Р·РЅР°С‡РµРЅРёСЏ
          # РїРµСЂРµРґР°СЋС‚СЃСЏ РІС…РѕРґРЅС‹РјРё РїР°СЂР°РјРµС‚СЂР°РјРё workflow_dispatch (РІСЃРµ РїСѓР±Р»РёС‡РЅС‹Рµ).
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ inputs.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ inputs.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY=${{ inputs.NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY || vars.NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_CHAT_ENABLED=${{ inputs.NEXT_PUBLIC_CHAT_ENABLED || vars.NEXT_PUBLIC_CHAT_ENABLED }}
            NEXT_PUBLIC_APP_URL=${{ inputs.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ inputs.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_INSSMART_TOKEN=${{ inputs.NEXT_PUBLIC_INSSMART_TOKEN || vars.NEXT_PUBLIC_INSSMART_TOKEN }}
            NEXT_PUBLIC_INSSMART_SECRET=${{ inputs.NEXT_PUBLIC_INSSMART_SECRET || vars.NEXT_PUBLIC_INSSMART_SECRET }}
            NEXT_PUBLIC_INSSMART_PRODUCT=${{ inputs.NEXT_PUBLIC_INSSMART_PRODUCT || vars.NEXT_PUBLIC_INSSMART_PRODUCT }}

      - name: Deploy to CapRover (production)
        uses: caprover/deploy-from-github@v2
        with:
          server: 'https://captain.vds.dogovor.expert'
          app: dogovor-prod
          token: ${{ secrets.CAPROVER_APP_TOKEN_PROD }}
          image: ghcr.io/dogovor-expert/dogovor-expert-app:production
