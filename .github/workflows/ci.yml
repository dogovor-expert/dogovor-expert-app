name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit

      # TICKET-5: ГОСТ-криптография УКЭП (эмулятор cadesplugin, без сети).
      # Регрессия в signCryptoPro/pades-verify/ocsp/crl должна валить PR.
      - name: UKEP signature tests
        run: npm run test:ukep

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse
        # Запускает `next start` (startServerCommand в .lighthouserc.json) и
        # меряет реальные страницы. Локальный baseline приблизителен; пороги
        # калибруются в .lighthouserc.json. Для точных метрик (LCP/CLS/TBT)
        # желателен прогон против продакшн-окружения.
        run: npx lhci autorun

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: npx supabase start

      - name: Run migrations
        run: npx supabase db reset

      - name: Export local Supabase keys
        run: |
          eval "$(npx supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop Supabase
        run: npx supabase stop