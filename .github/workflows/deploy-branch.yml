name: Deploy branch snapshot

# CapRover собирает ветку `deploy` — один коммит (полный текущий срез кода без
# истории). Это делает git clone на VDS быстрым и надёжным: не тянется вся
# история репозитория (~150 МБ) по флапающему каналу, только дерево.
# См. docs/DEPLOY.md → «Ветка deploy».
#
# Здесь: на каждый push в `production` (или вручную) пересобираем orphan-ветку
# `deploy` из текущего дерева и force-push'им её. История `package-lock.json`,
# старых ассетов и т.п. в неё не попадает — её просто нет.

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build single-commit deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git add -A
          git commit -m "deploy snapshot ${GITHUB_SHA}"
          git push --force origin deploy
