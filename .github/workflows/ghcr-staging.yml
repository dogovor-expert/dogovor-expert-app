name: Build & Push GHCR (staging)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      NEXT_PUBLIC_SUPABASE_URL:
        description: 'Supabase project URL (public)'
        type: string
        default: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY:
        description: 'Supabase anon key (public)'
        type: string
        default: ''
      NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY:
        description: 'Yandex SmartCaptcha client key (public)'
        type: string
        default: ''
      NEXT_PUBLIC_CHAT_ENABLED:
        description: '1 = include chat widget'
        type: string
        default: ''
      NEXT_PUBLIC_APP_URL:
        description: 'Canonical app URL'
        type: string
        default: ''
      NEXT_PUBLIC_SITE_URL:
        description: 'Canonical site URL'
        type: string
        default: ''
      NEXT_PUBLIC_INZURO_API_KEY:
        description: 'Inzuro widget public key'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-staging
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/dogovor-expert/dogovor-expert-app:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* инлайнятся в клиентский бандл на билде — значения
          # берутся из репозиторийных Variables, либо из входных параметров
          # workflow_dispatch (все значения публичные, в git не хранятся).
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || inputs.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || inputs.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY || inputs.NEXT_PUBLIC_SMARTCAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_CHAT_ENABLED=${{ vars.NEXT_PUBLIC_CHAT_ENABLED || inputs.NEXT_PUBLIC_CHAT_ENABLED }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || inputs.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || inputs.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_INZURO_API_KEY=${{ vars.NEXT_PUBLIC_INZURO_API_KEY || inputs.NEXT_PUBLIC_INZURO_API_KEY }}
