name: Deploy watch (production)

# Ручной сторожевой контроль деплоя: ждёт, пока прод начнёт отдавать ВСЕ
# маршруты (новые страницы 404, пока жив старый контейнер), затем завершается.
#
# ВАЖНО: деплой теперь идёт через Dokploy и локальное git-зеркало на VDS
# (`git push vds master` + Deploy в панели), а НЕ через GitHub-ветку `production`.
# Поэтому автоматического триггера на push больше нет — запускайте вручную:
#   node scripts/deploy-watch.mjs
# или вручную через Actions. Секретов не требует.

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: prod-deploy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait until the new build serves all routes
        run: node scripts/deploy-watch.mjs

      - name: Verify prod serves NEW code (content markers, not just HTTP 200)
        run: npm run deploy:content
