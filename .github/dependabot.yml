version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    groups:
      production-major:
        dependency-type: "production"
        update-types:
          - "major"
        labels:
          - "dependencies"
          - "breaking"
      production-minor:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        labels:
          - "dependencies"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        labels:
          - "dependencies"
          - "dev"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    # Не авто-merge: ручной review для security
    # Если хотите авто-merge для patch-версий: добавить `.github/dependabot-auto-merge.yml`
    ignore:
      # Sentry SDK обновляется вручную (breaking changes)
      - dependency-name: "@sentry/*"
        update-types: ["version-update:semver-major"]
    # Пропускать major-обновления Next.js (ручное тестирование)
    # Авто-PR только для minor/patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(actions)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "security"
    # Только security-обновления через groups
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
