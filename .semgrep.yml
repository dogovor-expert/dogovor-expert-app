rules:
  # Next.js / React безопасность
  - id: nextjs-no-dangerously-set-inner-html
    patterns:
      - pattern: '<$X dangerouslySetInnerHTML={{ __html: $Y }} ... />'
      - pattern: '<$X ... dangerouslySetInnerHTML={{ __html: $Y }} ... />'
    message: |
      XSS risk. dangerouslySetInnerHTML должен быть обёрнут в DOMPurify
      (см. src/lib/dompurify.ts) или заменён на безопасный API.
    languages: [typescript, javascript]
    severity: ERROR

  - id: nextjs-no-window-open
    pattern: window.open($X)
    message: |
      window.open() без `noopener,noreferrer` — утечка window.opener.
      Используйте `window.open(url, '_blank', 'noopener,noreferrer')`.
    languages: [typescript, javascript]
    severity: WARNING

  - id: react-use-client-with-server-only
    patterns:
      - pattern: |
          import { cookies } from "next/headers"
          ...
          "use client"
      - pattern: |
          "use client"
          ...
          import { cookies } from "next/headers"
    message: |
      cookies() доступен ТОЛЬКО в server components/actions.
      "use client" директива запрещает server-only импорты.
    languages: [typescript, javascript]
    severity: ERROR

  - id: react-no-direct-fetch-in-component
    patterns:
      - pattern: |
          useEffect(() => {
            ...
            fetch($URL)
            ...
          })
    message: |
      Рассмотрите React Query / SWR / Server Component вместо прямого fetch.
      Для простых случаев OK, но для production лучше useSWR/useQuery.
    languages: [typescript, javascript]
    severity: INFO

  - id: nextjs-no-process-env-in-client
    patterns:
      - pattern: |
          "use client"
          ...
          process.env.$VAR
      - pattern: |
          process.env.$VAR
          ...
          "use client"
    message: |
      process.env доступен в client только для NEXT_PUBLIC_* переменных.
      Для server-side секретов — используйте server actions.
    languages: [typescript, javascript]
    severity: WARNING

  - id: supabase-missing-rls
    # Semgrep не может выразить «в файле нет ALTER ... ENABLE ROW LEVEL SECURITY»
    # паттерном по одной строке — это INFO-напоминание, проверка на ревью.
    pattern-regex: '(?i)^\s*create\s+table'
    message: |
      Новая таблица: убедитесь, что есть ENABLE ROW LEVEL SECURITY + политики
      SELECT/INSERT/UPDATE/DELETE в той же миграции.
    languages: [generic]
    severity: INFO
    paths:
      include:
        - "supabase/migrations/**"

  - id: console-log-in-production
    pattern: console.log(...)
    message: |
      console.log в production коде. Используйте:
      - Sentry.captureMessage() для алертов
      - console.warn / console.error допустимы
      - для dev: console.log + process.env.NODE_ENV check
    languages: [typescript, javascript]
    severity: WARNING
    paths:
      exclude:
        - "**/*.test.ts"
        - "src/lib/validations/**"

  - id: any-type-cast
    pattern: $X as any
    message: |
      `as any` отключает type safety. Используйте:
      - `as unknown as Type` (явное приведение)
      - исправьте тип
      - `// @ts-expect-error` (с обоснованием)
    languages: [typescript, javascript]
    severity: WARNING

  - id: hardcoded-secret
    patterns:
      - pattern-regex: '(?i)(api[_-]?key|secret|password|token)\s*[:=]\s*["'']([a-zA-Z0-9_-]{20,})["'']'
    message: |
      Hardcoded secret. Перенесите в env (process.env.* или .env.local).
      Если это пример — добавьте в .gitleaksignore.
    languages: [typescript, javascript]
    severity: ERROR

  - id: zod-any-or-unknown
    patterns:
      - pattern: z.any()
      - pattern: z.unknown()
    message: |
      z.any() / z.unknown() отключают валидацию. Используйте:
      - z.string() с transform/parse
      - z.object({ ... }).passthrough() если нужна гибкость
    languages: [typescript, javascript]
    severity: WARNING

  - id: missing-csrf-protection
    patterns:
      - pattern: export const POST = $HANDLER;
      - pattern: export const PUT = $HANDLER;
      - pattern: export const PATCH = $HANDLER;
      - pattern: export const DELETE = $HANDLER;
      - pattern-not: export const POST = withCsrf($$$);
      - pattern-not: export const PUT = withCsrf($$$);
      - pattern-not: export const PATCH = withCsrf($$$);
      - pattern-not: export const DELETE = withCsrf($$$);
    message: |
      POST/PUT/DELETE без withCsrf() — уязвимость CSRF.
      Оберните в withCsrf(handler) из src/lib/csrf.ts.
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include:
        - "src/app/api/**"
